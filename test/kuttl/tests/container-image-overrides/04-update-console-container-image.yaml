---
apiVersion: lightspeed.openstack.org/v1beta1
kind: OpenStackLightspeed
metadata:
  name: openstack-lightspeed
  namespace: openstack-lightspeed
spec:
  tlsCACertBundle: openstack-lightspeed-cert
  defaultModel: default-model
  models:
    - name: default-model
      llmEndpoint: http://mock-llm-api-server-pod:8000/v1
      llmEndpointType: openai
      llmCredentials: openstack-lightspeed-apitoken
      modelName: ibm-granite/granite-3.1-8b-instruct
      llmProjectID: test-project-id
      llmDeploymentName: test-deployment-name
      llmAPIVersion: v1
  rag:
    containerImage: quay.io/openstack-lightspeed/rag-content:os-docs-2026.1-ogx
  ogx:
    logLevel: DEBUG
    containerImage: quay.io/lightspeed-core/lightspeed-stack:0.7.0rc3
  lcore:
    logLevel: WARNING
    containerImage: quay.io/lightspeed-core/lightspeed-stack:0.7.0rc3
  dataverseExporter:
    logLevel: DEBUG
    containerImage: quay.io/lightspeed-core/lightspeed-to-dataverse-exporter:latest
  console:
    containerImage: registry.redhat.io/openshift-lightspeed/lightspeed-console-plugin-rhel9:1.0.12
  database:
    containerImage: quay.io/sclorg/postgresql-16-c10s:latest
  okp:
    containerImage: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9@sha256:576abe26ace61e70c077ca45bbb7c754ae3e1579b3122a09ea97ca311b3c8c3f
  dev:
    okpChunkFilterQuery: "product:(*openstack* OR *openshift*)"
  quotas:
    limiters:
      - name: per-user-hourly
        type: userLimiter
        initialQuota: 1000
        quotaIncrease: 1000
        period: "1 hour"
      - name: cluster-daily
        type: clusterLimiter
        initialQuota: 100000
        quotaIncrease: 100000
        period: "1 day"
    enableTokenHistory: true

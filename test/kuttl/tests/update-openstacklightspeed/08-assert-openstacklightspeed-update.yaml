# Postgres resources
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - type: command
    command: ../../common/collectors/collect-workload-diagnostics.sh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lightspeed-postgres-conf
  namespace: openstack-lightspeed
---
apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-postgres-bootstrap
  namespace: openstack-lightspeed
---
apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-postgres-secret
  namespace: openstack-lightspeed
---
apiVersion: v1
kind: Service
metadata:
  name: lightspeed-postgres-server
  namespace: openstack-lightspeed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-postgres-server
  namespace: openstack-lightspeed
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lightspeed-postgres-server
          resources:
            requests:
              cpu: 30m
              memory: 300Mi
            limits:
              cpu: 500m
              memory: 3Gi
status:
  replicas: 1
  readyReplicas: 1
  availableReplicas: 1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lightspeed-postgres-server
  namespace: openstack-lightspeed

# OKP Deployment with custom resources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-okp-server
  namespace: openstack-lightspeed
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: okp
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 5Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

# LCore resources
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightspeed-app-server
  namespace: openstack-lightspeed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-config
  namespace: openstack-lightspeed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lightspeed-stack-config
  namespace: openstack-lightspeed
---
apiVersion: v1
kind: Service
metadata:
  name: lightspeed-app-server
  namespace: openstack-lightspeed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-stack-deployment
  namespace: openstack-lightspeed
  generation: 2
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: vector-database-collect
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: vector-database-config-build
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: ogx
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 9Gi
          env:
            - name: PROVIDER_DEFAULT_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  key: apitoken
                  name: openstack-lightspeed-apitoken-update
            - name: PROVIDER_DEFAULT_MODEL_URL
              value: http://mock-llm-api-server-pod-UPDATE:8000/v1
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: lightspeed-postgres-secret
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: lightspeed-postgres-secret
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
            - name: OGX_LOGGING
              value: core=debug,providers=info
            - name: VECTOR_DB_DATA_PATH
              value: /vector-db-discovered-values
            - name: RH_SERVER_OKP
              value: http://lightspeed-okp-server.openstack-lightspeed.svc:8080
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              subPath: tls-ca-bundle.pem
              readOnly: true
            - name: vector-db-discovered-values
              mountPath: /vector-db-discovered-values
            - name: ogx-cache
              mountPath: /tmp/ogx
            - name: tmp-writable-volume
              mountPath: /tmp
        - name: lightspeed-service-api
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 3Gi
          env:
            - name: LIGHTSPEED_STACK_LOG_LEVEL
              value: ERROR
            - name: RH_SERVER_OKP
              value: http://lightspeed-okp-server.openstack-lightspeed.svc:8080
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: lightspeed-postgres-secret
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: lightspeed-postgres-secret
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
              subPath: tls-ca-bundle.pem
              readOnly: true
            - name: vector-db-discovered-values
              mountPath: /vector-db-discovered-values
            - name: tmp-writable-volume
              mountPath: /tmp
            - name: tls-certs
              mountPath: /etc/certs/lightspeed-tls
              readOnly: true
      volumes:
        - name: ogx-config
          configMap:
            name: ogx-config
        - name: lightspeed-stack-config
          configMap:
            name: lightspeed-stack-config
        - name: vector-db-scripts
          configMap:
            name: vector-db-scripts
        - name: ca-bundle
          configMap:
            name: openstack-lightspeed-ca-bundle
        - name: vector-db-discovered-values
          emptyDir: {}
        - name: ogx-cache
          emptyDir: {}
        - name: tmp-writable-volume
          emptyDir: {}
        - name: tls-certs
          secret:
            secretName: lightspeed-tls
status:
  replicas: 1
  readyReplicas: 1
  availableReplicas: 1
  observedGeneration: 2
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lightspeed-app-server
  namespace: openstack-lightspeed

# CA bundle ConfigMap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-lightspeed-ca-bundle
  namespace: openstack-lightspeed

# Vector DB init containers scripts
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-db-scripts
  namespace: openstack-lightspeed

---
apiVersion: lightspeed.openstack.org/v1beta1
kind: OpenStackLightspeed
metadata:
  name: openstack-lightspeed
  namespace: openstack-lightspeed
spec:
  defaultModel: default-model
  models:
    - name: default-model
      llmEndpoint: http://mock-llm-api-server-pod-UPDATE:8000/v1
      llmEndpointType: rhoai_vllm
      llmCredentials: openstack-lightspeed-apitoken-update
      modelName: ibm-granite/granite-3.1-8b-instruct-UPDATE
      llmProjectID: test-project-id-UPDATE
      llmDeploymentName: test-deployment-name-UPDATE
      llmAPIVersion: v1.1
  tlsCACertBundle: openstack-lightspeed-cert-update
  dataverseExporter:
    feedback:
      enabled: false
    transcripts:
      enabled: false
    logLevel: ERROR
  ogx:
    logLevel: "core=debug,providers=info"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 9Gi
  lcore:
    logLevel: ERROR
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 3Gi
  database:
    resources:
      requests:
        cpu: 30m
        memory: 300Mi
      limits:
        cpu: 500m
        memory: 3Gi
  okp:
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 5Gi
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Ready
      message: Setup complete
    - type: OpenStackLightspeedReady
      status: "True"
      reason: Ready
      message: OpenStack Lightspeed created

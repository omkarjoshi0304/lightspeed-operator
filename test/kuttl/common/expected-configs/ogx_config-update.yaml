apis:
- agents
- files
- inference
- safety
- tool_runtime
- vector_io
external_providers_dir: /app-root/providers.d
image_name: openstack-lightspeed-configuration
providers:
  agents:
  - config:
      persistence:
        agent_state:
          backend: kv_default
          namespace: agents_state
        responses:
          backend: sql_default
          table_name: agents_responses
    provider_id: meta-reference
    provider_type: inline::meta-reference
  files:
  - config:
      metadata_store:
        backend: sql_default
        table_name: files_metadata
      storage_dir: /tmp/llama-stack/files
    provider_id: meta-reference-files
    provider_type: inline::localfs
  inference:
  - config:
      allowed_models:
      - ${env.E2E_OPENAI_MODEL:=gpt-4o-mini}
      api_key: ${env.OPENAI_API_KEY}
    provider_id: openai
    provider_type: remote::openai
  - provider_id: sentence-transformers
    provider_type: inline::sentence-transformers
  - config:
      allowed_models:
      - ibm-granite/granite-3.1-8b-instruct-UPDATE
      api_token: ${env.OPENSTACK_LIGHTSPEED_PROVIDER_API_KEY}
      base_url: http://mock-llm-api-server-pod-UPDATE:8000/v1
    provider_id: vllm-rhaiis
    provider_type: remote::vllm
  safety: []
  tool_runtime:
  - config: {}
    provider_id: rag-runtime
    provider_type: inline::rag-runtime
  vector_io:
  - config:
      persistence:
        backend: kv_default
        namespace: vector_io::faiss
    provider_id: faiss
    provider_type: inline::faiss
  - config:
      chunk_window_config:
        chunk_content_field: chunk_field
        chunk_family_fields:
        - headings
        chunk_filter_query: is_chunk:true AND product:(*openstack* OR *openshift*)
        chunk_index_field: chunk_index
        chunk_online_source_url_field: online_source_url
        chunk_parent_id_field: parent_id
        chunk_source_path_field: source_path
        chunk_token_count_field: num_tokens
        parent_total_chunks_field: total_chunks
        parent_total_tokens_field: total_tokens
      collection_name: ${env.SOLR_COLLECTION:=portal-rag}
      content_field: ${env.SOLR_CONTENT_FIELD:=chunk}
      embedding_dimension: ${env.SOLR_EMBEDDING_DIM:=384}
      embedding_model: ${env.SOLR_EMBEDDING_MODEL:=sentence-transformers/ibm-granite/granite-embedding-30m-english}
      persistence:
        backend: kv_default
        namespace: portal-rag
      solr_url: http://lightspeed-okp-server.openstack-lightspeed.svc:8080/solr
      vector_field: ${env.SOLR_VECTOR_FIELD:=chunk_vector}
    provider_id: okp_solr
    provider_type: remote::solr_vector_io
  - config:
      persistence:
        namespace: vector_io::faiss
        backend: kv_rag_UUID_os_product_docs
    provider_id: os-docs-2026.1-ogx
    provider_type: inline::faiss
registered_resources:
  models:
  - metadata:
      embedding_dimension: 384
    model_id: solr_embedding
    model_type: embedding
    provider_id: sentence-transformers
    provider_model_id: ${env.SOLR_EMBEDDING_MODEL:=ibm-granite/granite-embedding-30m-english}
  - model_id: ibm-granite/granite-3.1-8b-instruct-UPDATE
    model_type: llm
    provider_id: vllm-rhaiis
    provider_model_id: ibm-granite/granite-3.1-8b-instruct-UPDATE
  - metadata:
      embedding_dimension: 768
    model_id: sentence-transformers/all-mpnet-base-v2
    provider_id: sentence-transformers
    provider_model_id: ${env.VECTOR_DB_DATA_PATH}/UUID/embeddings_model
    model_type: embedding
  shields: []
  tool_groups:
  - provider_id: rag-runtime
    toolgroup_id: builtin::rag
  vector_stores:
  - embedding_dimension: 384
    embedding_model: ${env.SOLR_EMBEDDING_MODEL:=sentence-transformers/ibm-granite/granite-embedding-30m-english}
    provider_id: okp_solr
    vector_store_id: portal-rag
  - embedding_dimension: 768
    embedding_model: sentence-transformers/${env.VECTOR_DB_DATA_PATH}/UUID/embeddings_model
    provider_id: os-docs-2026.1-ogx
    vector_store_id: vs_UUID
safety:
  default_shield_id: null
scoring_fns: []
server:
  auth: null
  host: 0.0.0.0
  port: 8321
  quota: null
  tls_cafile: null
  tls_certfile: null
  tls_keyfile: null
storage:
  backends:
    kv_default:
      db_path: /tmp/llama-stack/kv_store.db
      type: kv_sqlite
    postgres_backend:
      db: llamastack
      host: lightspeed-postgres-server.openstack-lightspeed.svc
      password: ${env.POSTGRESQL_PASSWORD}
      port: 5432
      type: sql_postgres
      user: ${env.POSTGRESQL_USER}
    sql_default:
      db_path: /tmp/llama-stack/sql_store.db
      type: sql_sqlite
    kv_rag_UUID_os_product_docs:
      type: kv_sqlite
      db_path: ${env.VECTOR_DB_DATA_PATH}/UUID/vector_db/os_product_docs/faiss_store.db
  stores:
    conversations:
      backend: postgres_backend
      table_name: openai_conversations
    inference:
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
      table_name: inference_store
    metadata:
      backend: kv_default
      namespace: registry
    prompts:
      backend: kv_default
      namespace: prompts
telemetry:
  enabled: false
vector_stores:
  annotation_prompt_params:
    enable_annotations: false
  default_embedding_model: null
  default_provider_id: faiss
version: 2
